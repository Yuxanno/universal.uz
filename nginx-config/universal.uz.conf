# Nginx configuration for universal.uz
# Simplified version for debugging

# Upstream for Node.js backend
upstream universal_backend {
    server 127.0.0.1:5050 fail_timeout=0;
}

# HTTP server
server {
    listen 80;
    listen [::]:80;
    server_name pos.universalbozor.uz www.pos.universalbozor.uz;

    # Root directory for static files
    root /var/www/universal.uz/client/dist;
    index index.html;

    # Logging
    access_log /var/log/nginx/universal.uz-access.log;
    error_log /var/log/nginx/universal.uz-error.log debug;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # API proxy - IMPORTANT: No trailing slash
    location /api {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    # Socket.IO WebSocket support - IMPORTANT: No trailing slash
    location /socket.io {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Public assets (images, uploads)
    location /uploads {
        alias /var/www/universal.uz/server/uploads;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # Frontend static files - must be last
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
